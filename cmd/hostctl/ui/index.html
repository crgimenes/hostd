<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hostd</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <nav id="sidebar" aria-label="fleet">
    <ol id="tree" role="tree"></ol>
    <footer id="sidebarFoot"><span id="state">connecting</span></footer>
  </nav>
  <div id="grip" role="separator" aria-orientation="vertical" tabindex="-1"></div>

  <section id="detail">
    <header id="toolbar">
      <div id="crumb">
        <h1 id="title">Fleet</h1>
        <p id="subtitle"></p>
      </div>
      <div id="controls">
        <span id="range" hidden>
          <span id="rangeText"></span>
          <button id="rangeReset" title="back to the live window">live</button>
        </span>
        <div id="windows" role="group" aria-label="window">
          <button data-seconds="300">5m</button>
          <button data-seconds="3600" class="on">1h</button>
          <button data-seconds="21600">6h</button>
          <button data-seconds="86400">24h</button>
        </div>
      </div>
    </header>

    <div id="content"></div>

    <div id="split" role="separator" aria-orientation="horizontal" tabindex="-1"></div>

    <section id="console">
      <header>
        <h2>Log</h2>
        <input type="search" id="filter" placeholder="Filter" spellcheck="false">
        <label id="followLabel"><input type="checkbox" id="follow" checked> Follow</label>
      </header>
      <ol id="lines"></ol>
    </section>
  </section>
</div>

<dialog id="command">
  <h3>The panel does not change anything</h3>
  <p>Run this where you keep your tree:</p>
  <code id="commandText"></code>
  <div class="actions">
    <button id="dismiss">Close</button>
    <button id="copy" class="default">Copy</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
